services:
  postgres:
    image: postgres:16
    container_name: personal-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: personal_agent
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: personal-agent-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      APP_API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD_URLENC:-change-me}@postgres:5432/personal_agent
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: personal-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    container_name: personal-agent-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
