services:
  postgres:
    image: postgres:16
    container_name: personal-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: personal_agent
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    container_name: personal-agent-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      TZ: UTC
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      APP_API_PREFIX: /api
      APP_BUSINESS_TIMEZONE: ${APP_BUSINESS_TIMEZONE:-Asia/Shanghai}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://1.117.63.81}
      APP_ENTITLEMENT_SECRET: ${APP_ENTITLEMENT_SECRET:-change-me-entitlement-secret}
      APP_ENABLE_PUBLIC_ENTITLEMENT_BOOTSTRAP: "true"
      APP_PUBLIC_ENTITLEMENT_BOOTSTRAP_TTL_SECONDS: "2592000"
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-false}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-volcengine_ark_coding_plan}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-}
      APP_LLM_PROMPT_VERSION: ${APP_LLM_PROMPT_VERSION:-pr-ci-gate.v1}
      APP_LLM_TIMEOUT_SECONDS: ${APP_LLM_TIMEOUT_SECONDS:-30}
      APP_LLM_INPUT_COST_PER_MILLION_USD: ${APP_LLM_INPUT_COST_PER_MILLION_USD:-0}
      APP_LLM_OUTPUT_COST_PER_MILLION_USD: ${APP_LLM_OUTPUT_COST_PER_MILLION_USD:-0}
      APP_EVALUATION_WRITE_SECRET: ${APP_EVALUATION_WRITE_SECRET:-}
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD_URLENC:-change-me}@postgres:5432/personal_agent
    command: ["/bin/sh", "-c", "python -m app.db_migration && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    container_name: personal-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    container_name: personal-agent-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
