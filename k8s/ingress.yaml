apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-agent
  namespace: personal-agent
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: personal-agent.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
