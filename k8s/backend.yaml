apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: personal-agent
data:
  APP_NAME: Personal Agent Assistant API
  APP_ENVIRONMENT: production
  APP_DEBUG: "false"
  APP_API_PREFIX: /api
  APP_LLM_ENABLED: "false"
  APP_LLM_PROVIDER: volcengine_ark_coding_plan
  APP_LLM_BASE_URL: https://ark.cn-beijing.volces.com/api/coding/v3
  APP_LLM_PROMPT_VERSION: pr-ci-gate.v1
  APP_EVALUATION_WRITE_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: personal-agent
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://postgres:change-me@postgres:5432/personal_agent
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personal-agent
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personal-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/your-org/personal-agent-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          command:
            - /bin/sh
            - -c
            - |
              python -m app.db_migration && \
              uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
